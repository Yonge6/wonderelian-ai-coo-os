<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WonderElian AI COO OS</title>
  <meta name="description" content="Local command center for WonderElian's consumer app portfolio.">
  <link rel="canonical" href="https://ops.wonderelian.com/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/phosphor/style.css">
  <link rel="stylesheet" href="./styles.css?v=20260818-automation-sync">
</head>
<body>
  <header class="masthead">
    <div class="brand-lockup">
      <h1>
        <span class="sr-only">AI COO OS</span>
        <span class="brand-logo-frame" aria-hidden="true"><img src="./assets/ai-coo-logo-image2-v2.png" alt=""></span>
      </h1>
    </div>
    <div class="header-tools">
      <div class="locale-switch" aria-label="Language"><button data-locale="en" class="active">EN</button><button data-locale="zh">中文</button></div>
    </div>
  </header>
  <nav aria-label="Workspace">
    <div class="nav-items">
      <button class="active" data-view="command" data-index="1"><i class="ph ph-house" aria-hidden="true"></i><span data-i18n="command_center">Command Center</span><b>01</b></button>
      <button data-view="apps" data-index="2"><i class="ph ph-grid-four" aria-hidden="true"></i><span data-i18n="apps">Apps</span><b>02</b></button>
      <button data-view="websites" data-index="3"><i class="ph ph-globe" aria-hidden="true"></i><span data-i18n="websites">Websites</span><b>03</b></button>
      <button data-view="insights" data-index="4"><i class="ph ph-lightbulb" aria-hidden="true"></i><span data-i18n="insights">Insights</span><b>04</b></button>
      <button data-view="actions" data-index="5"><i class="ph ph-check-circle" aria-hidden="true"></i><span data-i18n="actions">Actions</span><b>05</b></button>
      <button data-view="experiments" data-index="6"><i class="ph ph-flask" aria-hidden="true"></i><span data-i18n="experiments">Experiments</span><b>06</b></button>
      <button data-view="content" data-index="7"><i class="ph ph-file-text" aria-hidden="true"></i><span data-i18n="content">Content</span><b>07</b></button>
      <button data-view="customers" data-index="8"><i class="ph ph-chat-centered-dots" aria-hidden="true"></i><span data-i18n="customers">Customers</span><b>08</b></button>
      <button data-view="sources" data-index="9"><i class="ph ph-database" aria-hidden="true"></i><span data-i18n="data_sources">Data Sources</span><b>09</b></button>
      <button data-view="playbooks" data-index="10"><i class="ph ph-target" aria-hidden="true"></i><span data-i18n="playbooks">Playbooks</span><b>10</b></button>
      <button data-view="activity" data-index="11"><i class="ph ph-clipboard-text" aria-hidden="true"></i><span data-i18n="activity">Operations Log</span><b>11</b></button>
    </div>
    <div class="nav-footer">
      <span class="label" data-i18n="update_checkpoint">Update checkpoint</span>
      <strong data-status-updated>—</strong>
      <p><span data-i18n="data_status">Data status</span> · <span data-i18n="latest_available">latest available</span> <i aria-hidden="true"></i></p>
      <p class="readonly-note" data-i18n="readonly_banner">Public read-only operating snapshot · writes, approvals, imports, and execution stay local.</p>
    </div>
  </nav>
  <p class="mode-banner" hidden data-i18n="readonly_banner">Public read-only snapshot. Run the local app for writes, approvals, and imports.</p>
  <main id="app"><p class="loading">Loading verified operating state…</p></main>
  <template id="form-template">
    <form class="panel form-panel"><h2></h2><div class="fields"></div><button type="submit">Save</button><p class="form-status" role="status"></p></form>
  </template>
  <script type="module" src="./app.js?v=20260818-automation-sync"></script>
</body>
</html>
